name = "okr-master"
main = "src/cloud/worker.ts"
compatibility_date = "2026-11-12"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
preview_urls = false

[vars]
APP_BASE_URL = "https://okr-master.olivermartin.org"

[assets]
directory = "./dist-cloud"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "okr-master"
database_id = "d3a5ca32-45e0-441c-85fc-9f97cfe922c2"

[triggers]
crons = ["*/5 * * * *"]
